
name: Build Sniper vs Runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract mod source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _source

          # Сначала проверяем, нет ли уже распакованного проекта
          BUILD_FILE="$(find . -type f \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path './.git/*' \
            -not -path './_source/*' \
            -not -path '*/build/*' \
            -not -path '*/.gradle/*' \
            -print -quit || true)"

          # Если проекта нет, ищем ZIP
          if [[ -z "$BUILD_FILE" ]]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' \
              -not -path './_source/*' \
              -print -quit || true)"

            if [[ -z "$ZIP_FILE" ]]; then
              echo "::error::Не найден ZIP с исходниками или build.gradle."
              exit 1
            fi

            echo "Найден архив: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d _source
          fi

          # Ищем Gradle-проект
          BUILD_FILE="$(find . -type f \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -not -path '*/.gradle/*' \
            -print -quit || true)"

          if [[ -z "$BUILD_FILE" ]]; then
            echo "::error::В архиве отсутствует build.gradle."
            exit 1
          fi

          BUILD_DIR="$(dirname "$BUILD_FILE")"

          if [[ ! -f "$BUILD_DIR/settings.gradle" && \
                ! -f "$BUILD_DIR/settings.gradle.kts" ]]; then
            echo "::error::Отсутствует settings.gradle."
            exit 1
          fi

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "Проект найден: $BUILD_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Minecraft mod
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$BUILD_DIR" clean build --no-daemon

      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail

          echo "Созданные JAR-файлы:"
          find "$BUILD_DIR/build/libs" -maxdepth 1 -type f -name '*.jar' -print

          if ! find "$BUILD_DIR/build/libs" -maxdepth 1 -type f -name '*.jar' | grep -q .; then
            echo "::error::JAR не создан."
            exit 1
          fi

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: Sniper-Vs-Runner-1.20.1
          path: ${{ env.BUILD_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
