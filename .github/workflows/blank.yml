
name: Build Sniper vs Runner

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download source project
        env:
          SOURCE_URL: REPLACE_WITH_YOUR_RELEASE_ZIP_URL
        run: |
          set -euo pipefail
          curl -fL "$SOURCE_URL" -o source.zip
          unzip -q source.zip -d source

      - name: Locate Gradle project
        run: |
          set -euo pipefail
          BUILD_FILE="$(find source -type f -name build.gradle -not -path '*/build/*' -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "::error::В архиве нет build.gradle"
            exit 1
          fi
          echo "BUILD_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        run: gradle -p "$BUILD_DIR" clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Sniper-Vs-Runner
          path: ${{ env.BUILD_DIR }}/build/libs/*.jar
          if-no-files-found: error
