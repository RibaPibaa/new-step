
name: Build Sniper vs Runner

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Find and extract source archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _source

          # Если Gradle-проект уже распакован, используем его.
          BUILD_FILE="$(find . -type f \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path './.git/*' \
            -not -path './_source/*' \
            -not -path '*/build/*' \
            -not -path '*/.gradle/*' -print -quit || true)"

          # Если проекта нет, ищем ZIP с исходниками.
          if [ -z "$BUILD_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' \
              -not -path './_source/*' -print -quit || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::Не найден Gradle-проект или ZIP с исходниками."
              echo "Файлы в репозитории:"
              find . -maxdepth 3 -type f
              exit 1
            fi

            echo "Найден архив: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d _source
          fi

          # Ищем проект после распаковки.
          BUILD_FILE="$(find . -type f \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path './.git/*' \
            -not -path '*/build/*' \
            -not -path '*/.gradle/*' \
            -print -quit || true)"

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::В загруженных файлах нет build.gradle."
            exit 1
          fi

          BUILD_DIR="$(dirname "$BUILD_FILE")"

          if [ ! -f "$BUILD_DIR/settings.gradle" ] && \
             [ ! -f "$BUILD_DIR/settings.gradle.kts" ]; then
            echo "::error::Не найден settings.gradle."
            exit 1
          fi

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "Найден проект: $BUILD_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle -p "$BUILD_DIR" clean build --no-daemon

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Sniper-Vs-Runner
          path: ${{ env.BUILD_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
