
name: Build Sniper vs Runner

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Сначала находим проект, чтобы проверить структуру репозитория
      - name: Find Gradle project
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$(find . -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)"

          if [[ -z "$BUILD_FILE" ]]; then
            echo "::error::Не найден build.gradle или build.gradle.kts."
            echo "Проверь, что исходники мода загружены в репозиторий."
            exit 1
          fi

          BUILD_DIR="$(dirname "$BUILD_FILE")"

          if [[ ! -f "$BUILD_DIR/settings.gradle" && ! -f "$BUILD_DIR/settings.gradle.kts" ]]; then
            echo "::error::В папке проекта отсутствует settings.gradle."
            exit 1
          fi

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "Найден проект: $BUILD_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$BUILD_DIR" clean build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Sniper-Vs-Runner
          path: ${{ env.BUILD_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
