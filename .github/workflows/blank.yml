
name: Build Sniper vs Runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Forge 1.20.1 Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Find Gradle project
        shell: bash
        run: |
          BUILD_FILE=$(find . -type f -name "build.gradle" \
            -not -path "*/build/*" \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::build.gradle not found! Upload the mod source files."
            echo "Repository contents:"
            ls -la
            exit 1
          fi

          BUILD_DIR=$(dirname "$BUILD_FILE")

          if [ ! -f "$BUILD_DIR/settings.gradle" ]; then
            echo "::error::settings.gradle not found in $BUILD_DIR"
            exit 1
          fi

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "Found project: $BUILD_DIR"

      - name: Build Minecraft Forge mod
        run: |
          gradle -p "$BUILD_DIR" clean build --no-daemon

      - name: Verify JAR
        run: |
          ls -lh "$BUILD_DIR/build/libs/"
          find "$BUILD_DIR/build/libs/" -maxdepth 1 -name "*.jar" \
            -type f | grep -q . || exit 1

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: Sniper-vs-Runner-Forge-1.20.1
          path: ${{ env.BUILD_DIR }}/build/libs/*.jar
          if-no-files-found: error
