name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q multiverse-stage1.zip -d project

      - name: Apply compatibility fixes
        working-directory: project
        run: |
          # 1. RenderLayerParent lives in renderer.entity, not renderer.entity.layers
          sed -i 's#renderer.entity.layers.RenderLayerParent#renderer.entity.RenderLayerParent#' src/main/java/com/multiverse/mod/client/SuitLayer.java

          # 2. Replace the DamageTypeTags check with a message-ID check
          sed -i '/import net.minecraft.world.damagesource.DamageTypeTags;/d' src/main/java/com/multiverse/mod/ServerEvents.java
          sed -i 's#event.getSource().is(DamageTypeTags.IS_FIRE)#(event.getSource().getMsgId().equals("inFire") || event.getSource().getMsgId().equals("onFire") || event.getSource().getMsgId().equals("lava"))#' src/main/java/com/multiverse/mod/ServerEvents.java

          # 3. This Forge version uses ArmorItem.Type and per-type armor methods
          cat > src/main/java/com/multiverse/mod/Heroes.java <<'EOF'
          package com.multiverse.mod;

          import net.minecraft.sounds.SoundEvent;
          import net.minecraft.sounds.SoundEvents;
          import net.minecraft.world.entity.EquipmentSlot;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.item.ArmorItem;
          import net.minecraft.world.item.ArmorMaterial;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.crafting.Ingredient;
          import net.minecraftforge.registries.DeferredRegister;
          import net.minecraftforge.registries.ForgeRegistries;
          import net.minecraftforge.registries.RegistryObject;

          public final class Heroes {
              public static final DeferredRegister<Item> ITEMS =
                      DeferredRegister.create(ForgeRegistries.ITEMS, MultiverseMod.MOD_ID);

              public static final RegistryObject<Item> HOMELANDER_CHEST = ITEMS.register("homelander_chestplate",
                      () -> new ArmorItem(SuitMaterial.HOMELANDER, ArmorItem.Type.CHESTPLATE, new Item.Properties().stacksTo(1)));
              public static final RegistryObject<Item> HOMELANDER_LEGS = ITEMS.register("homelander_leggings",
                      () -> new ArmorItem(SuitMaterial.HOMELANDER, ArmorItem.Type.LEGGINGS, new Item.Properties().stacksTo(1)));
              public static final RegistryObject<Item> HOMELANDER_BOOTS = ITEMS.register("homelander_boots",
                      () -> new ArmorItem(SuitMaterial.HOMELANDER, ArmorItem.Type.BOOTS, new Item.Properties().stacksTo(1)));

              private Heroes() {}

              /** True only when the full Homelander set is equipped. */
              public static boolean isWearingHomelander(LivingEntity e) {
                  return e.getItemBySlot(EquipmentSlot.CHEST).is(HOMELANDER_CHEST.get())
                          && e.getItemBySlot(EquipmentSlot.LEGS).is(HOMELANDER_LEGS.get())
                          && e.getItemBySlot(EquipmentSlot.FEET).is(HOMELANDER_BOOTS.get());
              }

              public enum SuitMaterial implements ArmorMaterial {
                  HOMELANDER;

                  @Override public int getDurabilityForType(ArmorItem.Type type) { return 0; }
                  @Override public int getDefenseForType(ArmorItem.Type type) { return 3; }
                  @Override public int getEnchantmentValue() { return 0; }
                  @Override public SoundEvent getEquipSound() { return SoundEvents.ARMOR_EQUIP_IRON; }
                  @Override public Ingredient getRepairIngredient() { return Ingredient.EMPTY; }
                  @Override public String getName() { return MultiverseMod.MOD_ID + ":homelander"; }
                  @Override public float getToughness() { return 2.0F; }
                  @Override public float getKnockbackResistance() { return 0.1F; }
              }
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build JAR
        working-directory: project
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: multiverse-jar
          path: project/build/libs/*.jar
